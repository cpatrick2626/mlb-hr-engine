<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FanDuel — HR Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #e0e8ff;
      font-family: "Barlow Condensed", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a2030;
      border: 1px solid rgba(59, 111, 255, 0.3);
      border-radius: 12px;
      padding: 32px 24px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .engine-label {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(59, 111, 255, 0.6);
      margin-bottom: 20px;
    }
    .player-name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #e0e8ff;
      margin-bottom: 28px;
      word-break: break-word;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 15px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-bottom: 10px;
    }
    .btn:active { opacity: 0.75; }
    .btn-fd {
      background: #1a4fff;
      color: #fff;
      border: none;
    }
    .btn-copy {
      background: transparent;
      border: 1px solid rgba(59, 111, 255, 0.45);
      color: #3b6fff;
    }
    .copied-msg {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #1aff66;
      margin-top: 6px;
      min-height: 18px;
    }
    .hint {
      font-size: 11px;
      color: rgba(224, 232, 255, 0.35);
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="engine-label">HR Engine — FanDuel Handoff</div>
    <div class="player-name" id="player-name">—</div>
    <button class="btn btn-fd" id="btn-open">Open FanDuel Search</button>
    <button class="btn btn-copy" id="btn-copy">Copy Name</button>
    <div class="copied-msg" id="copied-msg"></div>
    <div class="hint">Tap "Open FanDuel Search" or paste the copied name into FanDuel's search to find HR props.</div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var q = params.get('q') || '';
      var fdUrl = q
        ? 'https://sportsbook.fanduel.com/search?q=' + encodeURIComponent(q)
        : 'https://sportsbook.fanduel.com/baseball/mlb?tab=player-home-runs';

      document.getElementById('player-name').textContent = q || '—';

      // Best-effort clipboard copy on load; may fail without a gesture on some browsers —
      // the btn-open handler below copies again inside a guaranteed user gesture.
      if (q && navigator.clipboard) {
        navigator.clipboard.writeText(q).catch(function () {});
      }

      function showCopied() {
        var el = document.getElementById('copied-msg');
        el.textContent = 'Name copied — paste in FanDuel search';
        clearTimeout(el._t);
        el._t = setTimeout(function () { el.textContent = ''; }, 3000);
      }

      document.getElementById('btn-open').addEventListener('click', function () {
        // Clipboard write synchronously inside this gesture as belt-and-suspenders.
        if (q && navigator.clipboard) {
          navigator.clipboard.writeText(q).catch(function () {});
        }
        // location.assign inside a user tap — best available attempt to stay in browser
        // rather than triggering the FD app universal-link intercept.
        location.assign(fdUrl);
      });

      document.getElementById('btn-copy').addEventListener('click', function () {
        if (q && navigator.clipboard) {
          navigator.clipboard.writeText(q).then(showCopied).catch(showCopied);
        } else {
          showCopied();
        }
      });
    })();
  </script>
</body>
</html>
