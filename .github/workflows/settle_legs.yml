name: Daily Supabase Legs Settlement

on:
  schedule:
    # 10:00 UTC is 6:00 AM ET during EDT and 5:00 AM ET during EST.
    # At this hour the ET calendar day has already advanced, so yesterday in
    # America/New_York is the completed game date to settle.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Leg date to settle (YYYY-MM-DD). Leave blank for yesterday ET.'
        required: false

jobs:
  settle-legs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mlb_hr_engine_v4/requirements-api.txt

      - name: Install dependencies
        run: pip install -r requirements-api.txt
        working-directory: mlb_hr_engine_v4

      - name: Resolve settlement date
        id: settlement-date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            settlement_date="$INPUT_DATE"
          else
            settlement_date="$(TZ=America/New_York date -d 'yesterday' +%F)"
          fi

          echo "date=$settlement_date" >> "$GITHUB_OUTPUT"
          echo "Settling leg_date=$settlement_date"

      - name: Run legs settlement resolver
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m api.settle_legs --commit --date "${{ steps.settlement-date.outputs.date }}"
        working-directory: mlb_hr_engine_v4

      - name: Backfill warehouse HR outcomes (non-blocking)
        continue-on-error: true
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m api.warehouse_backfill --commit --date "${{ steps.settlement-date.outputs.date }}"
        working-directory: mlb_hr_engine_v4

      - name: Run supervised learning analysis (non-blocking)
        continue-on-error: true
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m api.learning_analysis --commit
        working-directory: mlb_hr_engine_v4
