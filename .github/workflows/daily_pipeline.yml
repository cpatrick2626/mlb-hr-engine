name: Daily MLB HR Pipeline

on:
  schedule:
    # All times UTC. Currently EDT (UTC-4); ET times shown reflect that offset.
    # GitHub Actions cron is fixed UTC — does NOT auto-adjust for DST.
    # When ET returns to EST (UTC-5) in November, these fire 1 hr earlier in ET; revisit then.
    #
    # Hourly gated triggers — 6 AM through midnight ET (10:00–03:00 UTC).
    # Each run fires the pipeline; should_pull_odds() decides whether to spend
    # Odds API requests (reads game times from free MLB Stats API — zero odds cost).
    # 6 AM anchor (10:00 UTC) builds the slate without pulling odds (guard blocks
    # until within 4 h of first pitch). Cron minutes are effectively free at this scale.
    - cron: "0 10 * * *"    #  6:00 AM ET — slate build / tripwire (guard blocks odds pull)
    - cron: "0 11 * * *"    #  7:00 AM ET
    - cron: "0 12 * * *"    #  8:00 AM ET
    - cron: "0 13 * * *"    #  9:00 AM ET
    - cron: "0 14 * * *"    # 10:00 AM ET
    - cron: "0 15 * * *"    # 11:00 AM ET
    - cron: "0 16 * * *"    # 12:00 PM ET
    - cron: "0 17 * * *"    #  1:00 PM ET
    - cron: "0 18 * * *"    #  2:00 PM ET
    - cron: "0 19 * * *"    #  3:00 PM ET
    - cron: "0 20 * * *"    #  4:00 PM ET
    - cron: "0 21 * * *"    #  5:00 PM ET
    - cron: "0 22 * * *"    #  6:00 PM ET
    - cron: "0 23 * * *"    #  7:00 PM ET
    - cron: "0  0 * * *"    #  8:00 PM ET
    - cron: "0  1 * * *"    #  9:00 PM ET
    - cron: "0  2 * * *"    # 10:00 PM ET
    - cron: "0  3 * * *"    # 11:00 PM ET
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to run (YYYY-MM-DD). Leave blank for today.'
        required: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mlb_hr_engine_v4/requirements-api.txt

      - name: Install dependencies
        run: pip install -r requirements-api.txt
        working-directory: mlb_hr_engine_v4

      - name: Run pipeline
        env:
          ODDS_API_KEY:          ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          TARGET_DATE:           ${{ inputs.date }}
        run: python -m api.cron ${{ inputs.date }}
        working-directory: mlb_hr_engine_v4
