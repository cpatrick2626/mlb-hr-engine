name: Daily MLB HR Pipeline

on:
  schedule:
    # All times UTC. During EDT (summer, UTC-4): exact ET shown. During EST (winter, UTC-5): runs fire 1 hr earlier in ET.
    # GitHub Actions cron is fixed UTC — no DST adjustment possible.
    # 6 runs/day to limit Odds API quota burn; tune if quota changes.
    - cron: '37 7 * * *'    #  3:37 AM EDT — early slate build; GitHub delay (~1-2hr) targets ~5am ET arrival
    - cron: '5 14 * * *'    # 10:05 AM EDT — morning run (lineups settled)
    - cron: '5 16 * * *'    # 12:05 PM EDT — midday pitcher refresh
    - cron: '5 18 * * *'    #  2:05 PM EDT — afternoon refresh
    - cron: '41 21 * * *'   #  5:41 PM EDT — evening game refresh
    - cron: '23 0 * * *'    #  8:23 PM EDT — end-of-window refresh
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to run (YYYY-MM-DD). Leave blank for today.'
        required: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mlb_hr_engine_v4/requirements-api.txt

      - name: Install dependencies
        run: pip install -r requirements-api.txt
        working-directory: mlb_hr_engine_v4

      - name: Run pipeline
        env:
          ODDS_API_KEY:          ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          TARGET_DATE:           ${{ inputs.date }}
        run: python -m api.cron ${{ inputs.date }}
        working-directory: mlb_hr_engine_v4
