name: Daily MLB HR Pipeline

on:
  schedule:
    # All times UTC. Currently EDT (UTC-4); times shown in ET reflect that offset.
    # GitHub Actions cron is fixed UTC — does NOT auto-adjust for DST.
    # When ET returns to EST (UTC-5) in November, these fire 1 hr earlier in ET; revisit then.
    - cron: "0 10 * * *"    #  6:00 AM ET — tripwire / early build (surfaces problems with time to fix)
    - cron: "0 15 * * *"    # 11:00 AM ET — early games (afternoon slate, lineups settled)
    - cron: "30 19 * * *"   #  3:30 PM ET — mid games (evening block)
    - cron: "30 23 * * *"   #  7:30 PM ET — late games (West Coast 9-10 PM)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to run (YYYY-MM-DD). Leave blank for today.'
        required: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mlb_hr_engine_v4/requirements-api.txt

      - name: Install dependencies
        run: pip install -r requirements-api.txt
        working-directory: mlb_hr_engine_v4

      - name: Run pipeline
        env:
          ODDS_API_KEY:          ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          TARGET_DATE:           ${{ inputs.date }}
        run: python -m api.cron ${{ inputs.date }}
        working-directory: mlb_hr_engine_v4
